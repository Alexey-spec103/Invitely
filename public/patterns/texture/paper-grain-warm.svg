<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260">
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.9" numOctaves="2" stitchTiles="stitch" result="fiber" seed="7" />
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch" result="speckle" seed="3" />
    <feBlend in="fiber" in2="speckle" mode="multiply" result="grain" />
    <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0 0.03  0 0 0 0.16 0" />
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)" />
</svg>
