<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Same seamless diagonal crosshatch as grain-light.svg, inverted to a
       light stroke for dark-background themes (dark strokes are invisible
       on a dark bg — same lesson as Emerald Grove skipping leaves.svg). -->
  <g stroke="#f5f0e8" stroke-width="0.5" opacity="0.05">
    <path d="M0 40 L40 0" />
    <path d="M-10 30 L10 10" />
    <path d="M30 50 L50 30" />
  </g>
</svg>
