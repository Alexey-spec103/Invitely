<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!--
    Seamless tile: every sprig is fully contained inside the 0-240 box
    (nothing crosses an edge), so repeating the tile leaves no visible seam.
  -->
  <defs>
    <g id="sprig" stroke="#5b4636" stroke-width="1" stroke-linecap="round" fill="none">
      <path d="M0 0 C 2 -9 3 -19 1 -30" />
      <path d="M1 -9 C -5 -12 -9 -18 -8 -24 C -3 -21 0 -15 1 -9 Z" fill="#5b4636" stroke-width="0.6" />
      <path d="M1 -16 C 7 -19 11 -25 9 -31 C 4 -27 1 -21 1 -16 Z" fill="#5b4636" stroke-width="0.6" />
      <path d="M1 -22 C -4 -24 -7 -29 -6 -34 C -2 -31 0 -27 1 -22 Z" fill="#5b4636" stroke-width="0.5" />
    </g>
  </defs>
  <g opacity="0.07">
    <use href="#sprig" transform="translate(50,80) rotate(18) scale(1.05)" />
    <use href="#sprig" transform="translate(150,50) rotate(-24) scale(0.85)" />
    <use href="#sprig" transform="translate(190,140) rotate(150) scale(1.1)" />
    <use href="#sprig" transform="translate(70,180) rotate(-150) scale(0.95)" />
    <use href="#sprig" transform="translate(130,190) rotate(35) scale(-0.7,0.7)" />
    <use href="#sprig" transform="translate(42,42) rotate(70) scale(0.8)" />
    <use href="#sprig" transform="translate(185,195) rotate(-60) scale(0.9) scale(-1,1)" />
  </g>
</svg>
